<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>C-berry Spa | 24-Hour Spa &amp; Massage in G.R.A., Enugu</title>
    <meta
      name="description"
      content="C-berry Spa is a 24-hour day spa inside De Castle Hotel, G.R.A. Enugu. Massage, facials, body scrubs and aromatherapy from ₦25,000. Book online or on WhatsApp."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://c-berry.vercel.app/" />
    <meta name="theme-color" content="#1c1411" />

    <!-- Icons: generated from favicon.svg by `npm run icons`. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Twitter. Absolute URLs: crawlers don't resolve relative ones. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="C-berry Spa" />
    <meta property="og:locale" content="en_NG" />
    <meta property="og:url" content="https://c-berry.vercel.app/" />
    <meta property="og:title" content="C-berry Spa, a 24-hour day spa in G.R.A. Enugu" />
    <meta
      property="og:description"
      content="Massage, facials, body scrubs and aromatherapy inside De Castle Hotel, G.R.A. Enugu. Open 24 hours, every day. Book online or on WhatsApp."
    />
    <meta property="og:image" content="https://c-berry.vercel.app/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://c-berry.vercel.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The C-berry wordmark and the words Day spa, open 24/7, G.R.A. Enugu over white pillar candles and dried leaves"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="C-berry Spa, a 24-hour day spa in G.R.A. Enugu" />
    <meta
      name="twitter:description"
      content="Massage, facials, body scrubs and aromatherapy inside De Castle Hotel, G.R.A. Enugu. Open 24 hours, every day. Book online or on WhatsApp."
    />
    <meta name="twitter:image" content="https://c-berry.vercel.app/og-image.jpg" />
    <meta
      name="twitter:image:alt"
      content="The C-berry wordmark and the words Day spa, open 24/7, G.R.A. Enugu over white pillar candles and dried leaves"
    />

    <!-- Hero photo is the LCP element: start fetching it before the JS bundle runs. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/hero-736.webp"
      imagesrcset="/images/hero-480.webp 480w, /images/hero-736.webp 736w"
      imagesizes="(min-width: 900px) 46vw, 100vw"
      fetchpriority="high"
    />

    <!-- Two families, four weights: Cormorant Garamond italic 500/600, Hanken Grotesk 400/500. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Hanken+Grotesk:wght@400;500&display=swap"
    />

    <!-- JSON-LD: added to <head> at build time from src/seo/structuredData.ts (see vite.config.ts). -->
  </head>
  <body>
    <noscript>
      <p style="padding: 1rem; font-family: sans-serif">
        C-berry's booking form needs JavaScript. Call or WhatsApp us on +234 702 552 9519. We're open 24 hours, every day.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
