<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>C-berry Spa | Massage, Facials &amp; Body Scrubs in G.R.A. Enugu, Open 24/7</title>
    <meta
      name="description"
      content="C-berry is a spa inside De Castle Hotel, G.R.A. Enugu, open 24 hours a day. Massage, facials, body scrubs and aromatherapy from ₦25,000. Book online or on WhatsApp."
    />
    <meta name="theme-color" content="#1c1411" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Open Graph / Twitter. TODO: once the domain is live, make og:image absolute and add og:url. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="C-berry" />
    <meta property="og:locale" content="en_NG" />
    <meta property="og:title" content="C-berry Spa, open 24/7 in G.R.A. Enugu" />
    <meta
      property="og:description"
      content="Luxury self-care, spa life, feminine wellness &amp; everyday healing. Massage, facials, scrubs and aromatherapy inside De Castle Hotel."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="C-berry, a candlelit spa in G.R.A. Enugu" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="C-berry Spa, open 24/7 in G.R.A. Enugu" />
    <meta
      name="twitter:description"
      content="Massage, facials, scrubs and aromatherapy inside De Castle Hotel, G.R.A. Enugu. Open 24 hours, every day."
    />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Hero photo is the LCP element: start fetching it before the JS bundle runs. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/hero-736.webp"
      imagesrcset="/images/hero-480.webp 480w, /images/hero-736.webp 736w"
      imagesizes="(min-width: 900px) 46vw, 100vw"
      fetchpriority="high"
    />

    <!-- Two families, four weights: Cormorant Garamond italic 500/600, Hanken Grotesk 400/500. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Hanken+Grotesk:wght@400;500&display=swap"
    />

    <!-- LocalBusiness data. Keep in sync with src/data/business.ts and src/data/services.ts. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "DaySpa",
        "name": "C-berry",
        "description": "Luxury self-care, spa life, feminine wellness & everyday healing.",
        "image": "/og-image.jpg",
        "telephone": "+2347025529519",
        "priceRange": "₦25,000–₦35,000",
        "currenciesAccepted": "NGN",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Inside De Castle Hotel, 14 Umuona Street, behind Park Lane Hospital, G.R.A.",
          "addressLocality": "Enugu",
          "addressRegion": "Enugu State",
          "addressCountry": "NG"
        },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
          "opens": "00:00",
          "closes": "23:59"
        },
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Treatments",
          "itemListElement": [
            { "@type": "Offer", "price": "35000", "priceCurrency": "NGN", "itemOffered": { "@type": "Service", "name": "Massage: Full Body with Essential Oils (60 min)" } },
            { "@type": "Offer", "price": "25000", "priceCurrency": "NGN", "itemOffered": { "@type": "Service", "name": "Facial Treatment: Deep Cleansing & Hydration (45 min)" } },
            { "@type": "Offer", "price": "30000", "priceCurrency": "NGN", "itemOffered": { "@type": "Service", "name": "Body Scrub: Exfoliation & Moisturization (50 min)" } },
            { "@type": "Offer", "price": "35000", "priceCurrency": "NGN", "itemOffered": { "@type": "Service", "name": "Aromatherapy Session: Relaxation & Stress Relief (40 min)" } }
          ]
        }
      }
    </script>
  </head>
  <body>
    <noscript>
      <p style="padding: 1rem; font-family: sans-serif">
        C-berry's booking form needs JavaScript. Call or WhatsApp us on +234 702 552 9519. We're open 24 hours, every day.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
